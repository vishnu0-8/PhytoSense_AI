services:
  - type: web
    name: plantai-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: DATABASE_PATH
        value: /var/data/detection_history.db
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
    disk:
      name: plantai-data
      mountPath: /var/data
      sizeGB: 1
